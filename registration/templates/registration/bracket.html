<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Bracket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            color: #000;
        }

        .header {
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 15px;
            border-bottom: 4px solid #e94560;
        }

        .header h1 {
            font-size: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .controls {
            background: white;
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .controls label {
            font-weight: bold;
            font-size: 13px;
        }

        .controls select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-secondary {
            background: #1a1a2e;
            color: white;
        }

        .btn-print {
            background: #28a745;
            color: white;
        }

        .btn-back {
            background: #6c757d;
            color: white;
        }

        .bracket-container {
            padding: 20px;
            overflow-x: auto;
        }

        .bracket-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #1a1a2e;
        }

        .bracket-subtitle {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .bracket {
            display: flex;
            gap: 0;
            align-items: flex-start;
            min-width: max-content;
            margin: 0 auto;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-width: 230px;
        }

        .round-title {
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            color: #1a1a2e;
            background: #e0e0e0;
            padding: 5px;
            margin-bottom: 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .match {
            margin: 8px 5px;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background: white;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .match-number {
            background: #1a1a2e;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            text-align: center;
        }

        .player {
            display: flex;
            align-items: center;
            padding: 7px 10px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f0f0f0;
            min-height: 44px;
        }

        .player:last-child {
            border-bottom: none;
        }

        .player:hover {
            background: #fff3f5;
        }

        .player.winner {
            background: #d4edda;
            font-weight: bold;
        }

        .player.bye-slot {
            background: #fff3cd;
            color: #856404;
            cursor: default;
            font-style: italic;
        }

        .player.empty {
            background: #f8f9fa;
            color: #aaa;
            cursor: default;
            font-style: italic;
        }

        .flag {
            font-size: 18px;
            margin-right: 6px;
            min-width: 24px;
        }

        .code {
            font-size: 10px;
            font-weight: bold;
            color: #1a1a2e;
            background: #e0e0e0;
            padding: 1px 5px;
            border-radius: 3px;
            margin-right: 7px;
            min-width: 32px;
            text-align: center;
        }

        .player-name {
            font-size: 12px;
            font-weight: bold;
            flex: 1;
        }

        .player-club {
            font-size: 10px;
            color: #888;
        }

        .winner-tick {
            color: green;
            font-size: 14px;
            margin-left: 5px;
        }

        .connector {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            color: #999;
            font-size: 18px;
        }

        .byes-section {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 12px 15px;
            margin: 0 0 15px 0;
        }

        .byes-title {
            font-weight: bold;
            font-size: 13px;
            color: #856404;
            margin-bottom: 8px;
        }

        .bye-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: white;
            border: 1px solid #ffc107;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            margin: 3px;
            color: #856404;
        }

        .winner-section {
            margin: 30px auto;
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 12px;
            border: 2px solid #e94560;
            max-width: 400px;
        }

        .winner-trophy {
            font-size: 50px;
            display: block;
            margin-bottom: 10px;
        }

        .winner-name {
            font-size: 22px;
            font-weight: bold;
            color: #e94560;
        }

        .winner-club {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .no-bracket {
            text-align: center;
            padding: 60px;
            color: #999;
            font-size: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @media print {
            .controls {
                display: none;
            }

            body {
                background: white;
            }

            .bracket-container {
                padding: 5px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Taekwondo Tournament</h1>
        <p>Tournament Bracket — Admin View</p>
    </div>

    <div class="controls">
        <a href="/admin/" class="btn btn-back">← Admin</a>
        <a href="/draws/" class="btn btn-secondary">Draws</a>
        <label>Gender:</label>
        <select id="genderSelect" onchange="updateCategories()">
            <option value="">Select Gender</option>
            <option value="male">♂ Male</option>
            <option value="female">♀ Female</option>
        </select>
        <label>Weight Category:</label>
        <select id="categorySelect" onchange="loadBracket()">
            <option value="">Select Category</option>
        </select>
        <button class="btn btn-primary" onclick="resetBracket()">Reset</button>
        <button class="btn btn-print" onclick="window.print()">Print</button>
    </div>

    <div id="bracketContainer" class="bracket-container">
        <div class="no-bracket">Select a gender and weight category to view the bracket</div>
    </div>

    <script>
        const maleCategories = {{ male_categories| safe }};
        const femaleCategories = {{ female_categories| safe }};

        let currentBracket = [];
        let currentGender = '';
        let currentCategory = '';
        let bracketData = {};
        let currentData = null;

        function updateCategories() {
            const gender = document.getElementById('genderSelect').value;
            const categorySelect = document.getElementById('categorySelect');
            categorySelect.innerHTML = '<option value="">Select Category</option>';
            const categories = gender === 'male' ? maleCategories : femaleCategories;
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categorySelect.appendChild(option);
            });
            document.getElementById('bracketContainer').innerHTML = '<div class="no-bracket">Select a weight category to view the bracket</div>';
        }

        function loadBracket() {
            const gender = document.getElementById('genderSelect').value;
            const category = document.getElementById('categorySelect').value;
            if (!gender || !category) return;

            currentGender = gender;
            currentCategory = category;
            document.getElementById('bracketContainer').innerHTML = '<div class="loading">Loading bracket...</div>';

            fetch(`/bracket/data/?gender=${gender}&category=${encodeURIComponent(category)}`)
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success') {
                        currentData = data;
                        bracketData = data.bracket_data || {};
                        renderBracket(data);
                    } else {
                        document.getElementById('bracketContainer').innerHTML = '<div class="no-bracket">No draw found for this category.</div>';
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('bracketContainer').innerHTML = '<div class="no-bracket">Error loading bracket.</div>';
                });
        }

        function getRoundName(roundIndex, totalRounds) {
            const remaining = totalRounds - roundIndex;
            if (remaining === 1) return 'FINAL';
            if (remaining === 2) return 'SEMI FINALS';
            if (remaining === 3) return 'QUARTER FINALS';
            return `ROUND OF ${Math.pow(2, remaining)}`;
        }

        function buildRounds(fixtures, byes) {
            let rounds = [];
            let firstRound = fixtures.map(f => ({
                player1: f.player1,
                player2: f.player2,
                isBye: false,
            }));
            byes.forEach(bye => {
                firstRound.push({ player1: bye, player2: null, isBye: true });
            });
            rounds.push(firstRound);

            let prevRound = firstRound;
            while (prevRound.length > 1) {
                let nextRound = [];
                for (let i = 0; i < prevRound.length; i += 2) {
                    nextRound.push({ player1: null, player2: null, isBye: false });
                }
                rounds.push(nextRound);
                prevRound = nextRound;
            }
            return rounds;
        }

        function findPlayer(name, data) {
            const all = [
                ...data.players,
                ...data.byes,
                ...(data.fixtures || []).flatMap(f => [f.player1, f.player2].filter(Boolean))
            ];
            return all.find(p => p && p.full_name === name) || null;
        }

        function renderBracket(data) {
            const fixtures = data.fixtures;
            const byes = data.byes;
            const players = data.players;
            const category = data.category;
            const gender = data.gender;

            if (fixtures.length === 0 && byes.length === 0) {
                document.getElementById('bracketContainer').innerHTML = '<div class="no-bracket">Not enough players for a bracket.</div>';
                return;
            }

            let rounds = buildRounds(fixtures, byes);


            Object.keys(bracketData).forEach(key => {
                const [ri, mi] = key.split('-').map(Number);
                const winnerName = bracketData[key];
                const nextRi = ri + 1;
                const nextMi = Math.floor(mi / 2);
                const isSlot1 = mi % 2 === 0;

                if (rounds[nextRi] && rounds[nextRi][nextMi]) {
                    const playerObj = findPlayer(winnerName, data) || {
                        full_name: winnerName, club_name: '', flag: '🏳️', code: 'N/A', nationality: ''
                    };
                    if (isSlot1) {
                        rounds[nextRi][nextMi].player1 = playerObj;
                    } else {
                        rounds[nextRi][nextMi].player2 = playerObj;
                    }
                }
            });

            currentBracket = rounds;

            let html = `
            <div class="bracket-title">${gender === 'male' ? '♂ Male' : '♀ Female'} — ${category}</div>
            <div class="bracket-subtitle">${players.length} athlete${players.length !== 1 ? 's' : ''} registered${byes.length > 0 ? ` | ${byes.length} BYE${byes.length !== 1 ? 's' : ''}` : ''}</div>
        `;

            if (byes.length > 0) {
                html += `<div class="byes-section"><div class="byes-title">⚡ BYE — Automatic advance to next round:</div>`;
                byes.forEach(bye => {
                    html += `<span class="bye-badge"><span>${bye.flag || '🏳️'}</span><strong>${bye.code || 'N/A'}</strong>${bye.full_name}</span>`;
                });
                html += `</div>`;
            }

            html += `<div class="bracket">`;

            rounds.forEach((round, roundIndex) => {
                html += `<div class="round"><div class="round-title">${getRoundName(roundIndex, rounds.length)}</div>`;

                round.forEach((match, matchIndex) => {
                    const matchKey = `${roundIndex}-${matchIndex}`;
                    const savedWinner = bracketData[matchKey];
                    const p1 = match.player1;
                    const p2 = match.player2;
                    const p1Won = savedWinner && p1 && savedWinner === p1.full_name;
                    const p2Won = savedWinner && p2 && savedWinner === p2.full_name;

                    html += `<div class="match"><div class="match-number">Match ${matchIndex + 1}</div>`;

                    // Player 1
                    if (p1) {
                        const byeClass = match.isBye ? 'bye-slot' : '';
                        const clickable = !match.isBye ? `onclick="selectWinner('${matchKey}', ${roundIndex}, ${matchIndex}, '${esc(p1.full_name)}', '${esc(p1.club_name)}', '${p1.flag || '🏳️'}', '${p1.code || 'N/A'}', '${esc(p1.nationality || '')}')"` : '';
                        html += `<div class="player ${p1Won ? 'winner' : ''} ${byeClass}" ${clickable}>
                        <span class="flag">${p1.flag || '🏳️'}</span>
                        <span class="code">${p1.code || 'N/A'}</span>
                        <div><div class="player-name">${p1.full_name}</div><div class="player-club">${p1.club_name || ''}</div></div>
                        ${p1Won ? '<span class="winner-tick">✅</span>' : ''}
                    </div>`;
                    } else {
                        html += `<div class="player empty">TBD</div>`;
                    }

                    // Player 2
                    if (p2) {
                        html += `<div class="player ${p2Won ? 'winner' : ''}" onclick="selectWinner('${matchKey}', ${roundIndex}, ${matchIndex}, '${esc(p2.full_name)}', '${esc(p2.club_name)}', '${p2.flag || '🏳️'}', '${p2.code || 'N/A'}', '${esc(p2.nationality || '')}')">
                        <span class="flag">${p2.flag || '🏳️'}</span>
                        <span class="code">${p2.code || 'N/A'}</span>
                        <div><div class="player-name">${p2.full_name}</div><div class="player-club">${p2.club_name || ''}</div></div>
                        ${p2Won ? '<span class="winner-tick">✅</span>' : ''}
                    </div>`;
                    } else if (match.isBye) {
                        html += `<div class="player bye-slot">⚡ BYE</div>`;
                    } else {
                        html += `<div class="player empty">TBD</div>`;
                    }

                    html += `</div>`;
                });

                html += `</div>`;
                if (roundIndex < rounds.length - 1) {
                    html += `<div class="connector">→</div>`;
                }
            });

            html += `</div>`;


            const finalKey = `${rounds.length - 1}-0`;
            const champion = bracketData[finalKey];
            if (champion) {
                const champObj = findPlayer(champion, data);
                html += `
                <div class="winner-section">
                    <span class="winner-trophy">🏆</span>
                    <div class="winner-name">${champObj ? champObj.flag : '🏳️'} ${champObj ? champObj.code : ''} ${champion}</div>
                    <div class="winner-club">🥇 CHAMPION — ${category}${champObj ? '<br>' + champObj.club_name : ''}</div>
                </div>`;
            }

            document.getElementById('bracketContainer').innerHTML = html;
        }

        function esc(str) {
            return (str || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function selectWinner(matchKey, roundIndex, matchIndex, playerName, clubName, flag, code, nationality) {

            bracketData[matchKey] = playerName;


            const nextRi = roundIndex + 1;
            const nextMi = Math.floor(matchIndex / 2);
            const isSlot1 = matchIndex % 2 === 0;

            if (currentBracket[nextRi] && currentBracket[nextRi][nextMi]) {
                const playerObj = { full_name: playerName, club_name: clubName, flag: flag, code: code, nationality: nationality };
                if (isSlot1) {
                    currentBracket[nextRi][nextMi].player1 = playerObj;
                } else {
                    currentBracket[nextRi][nextMi].player2 = playerObj;
                }
            }


            if (currentData) {
                currentData.bracket_data = bracketData;
                renderBracket(currentData);
            }


            fetch('/bracket/save/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                body: JSON.stringify({ gender: currentGender, category: currentCategory, bracket_data: bracketData })
            });
        }

        function resetBracket() {
            if (!currentGender || !currentCategory) {
                alert('Please select a gender and category first.');
                return;
            }
            if (!confirm('Reset this bracket? All winner selections will be cleared.')) return;
            bracketData = {};
            fetch('/bracket/save/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                body: JSON.stringify({ gender: currentGender, category: currentCategory, bracket_data: {} })
            }).then(() => loadBracket());
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>

</body>

</html>
